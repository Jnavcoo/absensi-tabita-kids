  content().innerHTML='<div class="success-screen"><div class="success-icon" style="background:var(--danger)"><i data-lucide="x" style="width:40px;height:40px"></i></div><h3 style="margin-bottom:8px">Tidak Ditemukan</h3><p style="color:var(--gray);font-size:13px;margin-bottom:18px">'+esc(msg)+'</p><button class="btn btn-primary btn-block" onclick="startScanner(mode)">Scan Ulang</button><button class="btn btn-outline btn-block" style="margin-top:10px" onclick="showOptions()">Kembali</button></div>';
  lucide.createIcons();
}

/* ---------- Konfirmasi identitas ---------- */
function showConfirm(){
  var label=mode==='datang'?'DATANG':'TIDAK DATANG';
  var next=mode==='datang'?'showSelfie()':'showAbsenceForm()';
  content().innerHTML='<div class="confirm-card"><div class="avatar blue" style="width:64px;height:64px;font-size:22px;margin:0 auto"></div><h3></h3><span class="nis-chip"></span><p></p></div><div class="warn-box" style="margin:0 0 14px;background:#eff6ff;color:#1d4ed8">Absensi: <strong>'+label+'</strong>. Pastikan data di atas adalah milik Anda.</div><button class="btn btn-primary btn-block" onclick="'+next+'">Ya, Lanjutkan</button><button class="btn btn-outline btn-block" style="margin-top:10px" onclick="startScanner(mode)">Bukan Saya / Scan Ulang</button><button class="btn btn-outline btn-block" style="margin-top:10px" onclick="cancelFlow()">Batal</button>';
  var c=content();
  c.querySelector('.avatar').textContent=getInit(currentStudent.nama);
  c.querySelector('h3').textContent=currentStudent.nama;
  c.querySelector('.nis-chip').textContent='NIS: '+(currentStudent.nis||currentStudent.barcode);
  c.querySelector('.confirm-card p').textContent='Kelas '+currentStudent.kelas;
}
function studentHeader(){
  return '<div class="confirm-card" style="margin-bottom:14px"><h3 id="sh-n"></h3><span class="nis-chip" id="sh-nis"></span> <span style="font-size:13px;color:var(--gray)" id="sh-k"></span></div>';
}
function fillStudentHeader(){
  var a=el('sh-n');if(a)a.textContent=currentStudent.nama;
  var b=el('sh-nis');if(b)b.textContent='NIS: '+(currentStudent.nis||currentStudent.barcode);
  var k=el('sh-k');if(k)k.textContent='Kelas '+currentStudent.kelas;
}

/* ---------- DATANG: selfie + lokasi ---------- */
function showSelfie(){
  locationData={lat:'',lng:'',alamat:'',state:'pending'};faceFails=0;busy=false;
  content().innerHTML=studentHeader()+'<div class="camera-box"><video id="selfie-video" class="camera-video" autoplay playsinline muted></video></div><div class="face-status loading" id="fs">Memuat kamera...</div><div class="loc-info" id="li"><i data-lucide="map-pin" style="width:14px"></i><span>Mendeteksi lokasi...</span></div><button class="btn btn-success btn-block" id="sbtn" disabled onclick="captureSubmit(false)"><i data-lucide="camera" style="width:16px"></i> Absen Sekarang</button><button class="btn btn-warning btn-block" id="fbtn" style="margin-top:10px;display:none" onclick="captureSubmit(true)">Kirim untuk Ditinjau Guru</button><button class="btn btn-outline btn-block" style="margin-top:10px" onclick="cancelFlow()">Batal</button>';
  fillStudentHeader();lucide.createIcons();getLoc();startSelfie();
}
function setFs(cls,txt){var f=el('fs');if(f){f.className='face-status '+cls;f.textContent=txt;}}
function showFallback(){var f=el('fbtn');if(f)f.style.display='inline-flex';}
function startSelfie(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setFs('error','Browser ini tidak mendukung kamera.');showFallback();return;}
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}}).then(function(s){
    if(!el('selfie-video')){s.getTracks().forEach(function(t){t.stop();});return;}
    videoStream=s;el('selfie-video').srcObject=s;loadFace();
  }).catch(function(e){
    var denied=/NotAllowed|Permission|denied/i.test(String((e&&e.name)||'')+String((e&&e.message)||''));
    setFs('error',denied?'Izin kamera ditolak. Aktifkan izin kamera di pengaturan browser. Atau kirim untuk ditinjau guru.':'Kamera tidak dapat dibuka. Anda dapat mengirim absensi untuk ditinjau guru.');
    showFallback();
  });
}
function stopCam(){if(videoStream){videoStream.getTracks().forEach(function(t){t.stop();});videoStream=null;}}
function loadFace(){
  var ready=function(){faceLoaded=true;setFs('success','Siap! Hadapkan wajah ke kamera lalu tekan Absen Sekarang.');var b=el('sbtn');if(b)b.disabled=false;};
  if(faceLoaded){ready();return;}
  setFs('loading','Memuat model pengenalan wajah...');
  var base='https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
  Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(base),faceapi.nets.faceLandmark68Net.loadFromUri(base),faceapi.nets.faceRecognitionNet.loadFromUri(base)]).then(ready).catch(function(){setFs('error','Model wajah gagal dimuat. Periksa koneksi, atau kirim untuk ditinjau guru.');showFallback();});
}
function getLoc(){
  var li=function(color,txt){var b=el('li');if(!b)return;b.innerHTML='<i data-lucide="map-pin" style="width:14px;color:'+color+'"></i><span></span>';b.querySelector('span').textContent=txt;lucide.createIcons();};
  if(!navigator.geolocation){locationData.state='unavailable';li('var(--danger)','Lokasi tidak didukung perangkat ini');return;}
  navigator.geolocation.getCurrentPosition(function(p){
    locationData.lat=p.coords.latitude;locationData.lng=p.coords.longitude;locationData.state='ok';
    li('var(--success)','Lokasi terdeteksi, mencari alamat...');
    fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+p.coords.latitude+'&lon='+p.coords.longitude).then(function(r){return r.json();}).then(function(d){
      locationData.alamat=(d&&d.display_name)||'';
      var t=locationData.alamat;li('var(--success)',t?(t.length>70?t.substring(0,70)+'...':t):'Lokasi terdeteksi');
    }).catch(function(){li('var(--success)','Lokasi terdeteksi (alamat tidak tersedia)');});
  },function(err){
    locationData.state=(err&&err.code===1)?'denied':'unavailable';
    li('var(--danger)',(err&&err.code===1)?'Izin lokasi ditolak - absensi tetap dapat dikirim tanpa lokasi':'Lokasi tidak tersedia');
  },{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
function snap(v){
  var w=Math.min(320,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);
  var cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(v,0,0,w,h);
  return cv.toDataURL('image/jpeg',0.6);
}
function setSelfieButtons(dis){var a=el('sbtn'),b=el('fbtn');if(a)a.disabled=dis;if(b)b.disabled=dis;}
function captureSubmit(skip){
  if(busy)return;
  var v=el('selfie-video');
  var hasVideo=v&&videoStream&&v.videoWidth>0;
  if(!skip&&!hasVideo){setFs('error','Kamera belum siap. Tunggu sebentar.');return;}
  busy=true;setSelfieButtons(true);
  var photo=hasVideo?snap(v):'';
  if(skip){sendAttendance(null,photo);return;}
  setFs('loading','Mendeteksi wajah...');
  var cv=document.createElement('canvas');cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext('2d').drawImage(v,0,0);
  faceapi.detectSingleFace(cv,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor().then(function(d){
    if(!d){faceFails++;busy=false;setSelfieButtons(false);setFs('error','Wajah tidak terdeteksi (percobaan '+faceFails+'). Hadapkan wajah ke kamera dengan cahaya cukup, lalu coba lagi.');if(faceFails>=3)showFallback();return;}
    sendAttendance(Array.from(d.descriptor),photo);
  }).catch(function(){faceFails++;busy=false;setSelfieButtons(false);setFs('error','Gagal memproses wajah. Coba lagi atau kirim untuk ditinjau guru.');showFallback();});
}
function sendAttendance(desc,photo){
  stopCam();
  content().innerHTML='<div class="spinner"></div><div class="center-msg">Menyimpan absensi...</div>';
  google.script.run.withSuccessHandler(function(r){
    busy=false;
    if(r&&r.success){showSuccess(r);}
    else if(r&&r.duplicate){showAlready(currentStudent.nama,r.status,r.waktu);}
    else{showError((r&&r.error)||'Absensi gagal disimpan.','showSelfie()');}
  }).withFailureHandler(function(e){busy=false;showError('Gagal terhubung ke server: '+((e&&e.message)||e),'showSelfie()');}).recordAttendance({
    studentId:currentStudent.id,faceDescriptor:desc,fotoAbsen:photo,latitude:locationData.lat,longitude:locationData.lng,alamat:locationData.alamat,device:(navigator.userAgent||'').substring(0,120)
  });
}

/* ---------- TIDAK DATANG ---------- */
function showAbsenceForm(){
  busy=false;
  content().innerHTML=studentHeader()+'<div class="form-label">Alasan tidak datang</div><div class="reason-grid" id="reasons">'+
  '<label class="reason-opt sel"><input type="radio" name="alasan" value="Sakit" checked onchange="pickReason()"> Sakit</label>'+
  '<label class="reason-opt"><input type="radio" name="alasan" value="Izin" onchange="pickReason()"> Izin</label>'+
  '<label class="reason-opt"><input type="radio" name="alasan" value="Lainnya" onchange="pickReason()"> Lainnya / Tanpa Keterangan</label></div>'+
  '<div class="form-group"><label class="form-label" for="skt">Catatan (opsional)</label><textarea class="form-input" id="skt" rows="3" maxlength="300" placeholder="Contoh: demam, ada acara keluarga"></textarea></div>'+
  '<button class="btn btn-primary btn-block" id="abtn" onclick="submitAbsence()">Kirim</button><button class="btn btn-outline btn-block" style="margin-top:10px" onclick="cancelFlow()">Batal</button>';
  fillStudentHeader();
}
function pickReason(){
  var o=document.querySelectorAll('.reason-opt');
  for(var i=0;i<o.length;i++){var r=o[i].querySelector('input');if(r.checked)o[i].classList.add('sel');else o[i].classList.remove('sel');}
}
function submitAbsence(){
  if(busy)return;
  var sel=document.querySelector('input[name="alasan"]:checked');
  if(!sel){showToast('Pilih alasan terlebih dahulu','error');return;}
  var ket=el('skt').value.trim();
  busy=true;var b=el('abtn');if(b){b.disabled=true;b.textContent='Menyimpan...';}
  google.script.run.withSuccessHandler(function(r){
    busy=false;
    if(r&&r.success){showAbsenceSuccess(r);}
    else if(r&&r.duplicate){showAlready(currentStudent.nama,r.status,r.waktu);}
    else{var b2=el('abtn');if(b2){b2.disabled=false;b2.textContent='Kirim';}showToast((r&&r.error)||'Gagal menyimpan','error');}
  }).withFailureHandler(function(e){busy=false;var b3=el('abtn');if(b3){b3.disabled=false;b3.textContent='Kirim';}showToast('Gagal terhubung ke server: '+((e&&e.message)||e),'error');}).submitSickLeave({studentId:currentStudent.id,alasan:sel.value,keterangan:ket});
}

/* ---------- Hasil ---------- */
function resultRows(rows){
  var h='<div class="result-box">';
  for(var i=0;i<rows.length;i++)h+='<p><strong>'+esc(rows[i][0])+':</strong> '+esc(rows[i][1])+'</p>';
  return h+'</div>';
}
function showSuccess(r){
  var late=r.status==='Terlambat';var col=late?'var(--warning)':'var(--success)';
  var title=late?'Absen Tercatat (Terlambat)':'Berhasil Absen Datang';
  var warn=r.perluReview?'<div class="warn-box">'+esc(r.verifikasiPesan)+'</div>':'';
  content().innerHTML='<div class="success-screen"><div class="success-icon" style="background:'+col+'"><i data-lucide="check" style="width:40px;height:40px"></i></div><h2 style="color:'+col+';margin-bottom:6px">'+title+'</h2><strong>'+esc(r.nama)+'</strong>'+
  resultRows([['NIS',r.nis],['Kelas',r.kelas],['Status',r.status],['Tanggal',r.tanggal],['Waktu',r.time+' WIB'],['Verifikasi wajah',r.verifikasi]])+warn+
  '<button class="btn btn-primary btn-block" style="margin-top:16px" onclick="showOptions()">Selesai</button></div>';
  lucide.createIcons();
}
function showAbsenceSuccess(r){
  content().innerHTML='<div class="success-screen"><div class="success-icon" style="background:var(--purple)"><i data-lucide="check" style="width:40px;height:40px"></i></div><h2 style="color:var(--purple);margin-bottom:6px">Tercatat Tidak Datang</h2><strong>'+esc(r.nama)+'</strong>'+
  resultRows([['NIS',r.nis],['Kelas',r.kelas],['Status',r.status],['Alasan',r.alasan==='Lainnya'?'Lainnya / Tanpa Keterangan':r.alasan],['Catatan',r.keterangan||'-'],['Tanggal',r.tanggal],['Waktu',r.time+' WIB']])+
  '<button class="btn btn-primary btn-block" style="margin-top:16px" onclick="showOptions()">Selesai</button></div>';
  lucide.createIcons();
}
function showAlready(nama,status,waktu){
  stopCam();stopScan();
  content().innerHTML='<div class="success-screen"><div class="success-icon" style="background:var(--warning)"><i data-lucide="info" style="width:40px;height:40px"></i></div><h3 style="margin-bottom:8px">Sudah Tercatat</h3><p style="color:var(--gray);font-size:13px;margin-bottom:18px"></p><button class="btn btn-primary btn-block" onclick="showOptions()">Kembali</button></div>';
  content().querySelector('p').textContent=nama+' sudah tercatat hari ini sebagai "'+status+'" pukul '+waktu+'. Absensi tidak dapat dicatat dua kali.';
  lucide.createIcons();
}
function showError(msg,retry){
  content().innerHTML='<div class="success-screen"><div class="success-icon" style="background:var(--danger)"><i data-lucide="x" style="width:40px;height:40px"></i></div><h3 style="margin-bottom:8px">Gagal</h3><p style="color:var(--gray);font-size:13px;margin-bottom:18px" id="err-msg"></p><button class="btn btn-primary btn-block" onclick="'+retry+'">Coba Lagi</button><button class="btn btn-outline btn-block" style="margin-top:10px" onclick="showOptions()">Kembali</button></div>';
  el('err-msg').textContent=msg;lucide.createIcons();
}

function showToast(m,t){var tc=el('toasts');var d=document.createElement('div');d.className='toast '+(t==='error'?'error':'');d.textContent=m;tc.appendChild(d);setTimeout(function(){d.remove();},3500);}
function getInit(n){if(!n)return'?';var p=String(n).trim().split(/\s+/);return p.length>=2?(p[0][0]+p[1][0]).toUpperCase():String(n).substring(0,2).toUpperCase();}
</script></body></html>
